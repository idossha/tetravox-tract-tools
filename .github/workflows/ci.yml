name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real data and the real app live on the reference machine, so a wired variable here is a mistake.
      - name: The reference variables are unset
        run: test -z "${TRACT_TOOLS_WHOLE:-}" && test -z "${TRACT_TOOLS_THIN:-}"
      - run: pnpm run verify
